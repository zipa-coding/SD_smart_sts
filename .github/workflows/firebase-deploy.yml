name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Prepare Firebase Credentials
        id: firebase_prep
        env:
          RAW_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_SMART_SD_STS || secrets.FIREBASE_SERVICE_ACCOUNT_SMARTSTS_12F15 || secrets.GCP_SA_KEY || secrets.GOOGLE_CREDENTIALS }}
          RAW_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const saRaw = process.env.RAW_SA || "";
            const tokenRaw = process.env.RAW_TOKEN || "";
            let hasSa = false;
            let projectId = "smart-sd-sts";

            if (saRaw.trim().startsWith("{")) {
              try {
                const parsed = JSON.parse(saRaw.trim());
                if (parsed.project_id) {
                  projectId = parsed.project_id;
                }
                hasSa = true;
                fs.writeFileSync(".firebaserc", JSON.stringify({ projects: { default: projectId } }, null, 2));
                console.log("Detected Service Account for project:", projectId);
              } catch (e) {
                console.error("Failed to parse FIREBASE_SERVICE_ACCOUNT JSON:", e.message);
              }
            }

            const hasToken = !hasSa && tokenRaw.trim().length > 0;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_sa=${hasSa}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_token=${hasToken}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `project_id=${projectId}\n`);

            if (!hasSa && !hasToken) {
              console.warn("PERINGATAN: Belum ada secret FIREBASE_SERVICE_ACCOUNT atau FIREBASE_TOKEN di GitHub Secrets.");
            }
          '

      - name: Deploy to Firebase Hosting (Service Account)
        if: steps.firebase_prep.outputs.has_sa == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_SMART_SD_STS || secrets.FIREBASE_SERVICE_ACCOUNT_SMARTSTS_12F15 || secrets.GCP_SA_KEY || secrets.GOOGLE_CREDENTIALS }}
          channelId: live
          projectId: ${{ steps.firebase_prep.outputs.project_id }}

      - name: Deploy to Firebase Hosting (Token)
        if: steps.firebase_prep.outputs.has_token == 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          npx -y firebase-tools deploy --only hosting --project "${{ steps.firebase_prep.outputs.project_id }}" --token "$FIREBASE_TOKEN"
