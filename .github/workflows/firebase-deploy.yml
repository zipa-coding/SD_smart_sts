name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  deployments: write
  pull-requests: write
  statuses: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      - name: Deploy to Firebase Hosting
        env:
          SA_1: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMART_SD_STS }}
          SA_2: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA_3: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTSTS_12F15 }}
          SA_4: ${{ secrets.GCP_SA_KEY }}
          SA_5: ${{ secrets.GOOGLE_CREDENTIALS }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          node -e '
            const fs = require("fs");
            const { spawnSync } = require("child_process");

            const rawCandidates = [
              { name: "FIREBASE_SERVICE_ACCOUNT_SMART_SD_STS", val: process.env.SA_1 },
              { name: "FIREBASE_SERVICE_ACCOUNT", val: process.env.SA_2 },
              { name: "FIREBASE_SERVICE_ACCOUNT_SMARTSTS_12F15", val: process.env.SA_3 },
              { name: "GCP_SA_KEY", val: process.env.SA_4 },
              { name: "GOOGLE_CREDENTIALS", val: process.env.SA_5 },
            ];

            const validSas = [];
            for (const item of rawCandidates) {
              const raw = (item.val || "").trim();
              if (!raw.startsWith("{")) continue;
              try {
                const parsed = JSON.parse(raw);
                if (parsed.client_email && parsed.private_key) {
                  validSas.push({
                    secretName: item.name,
                    raw,
                    projectId: parsed.project_id || "smart-sd-sts",
                    clientEmail: parsed.client_email,
                    isGithubActionSa: String(parsed.client_email).includes("github-action"),
                  });
                }
              } catch (e) {
                console.warn(`Secret ${item.name} bukan JSON valid:`, e.message);
              }
            }

            // Prioritaskan service account github-action-* (yang otomatis punya role Hosting Admin)
            validSas.sort((a, b) => (b.isGithubActionSa ? 1 : 0) - (a.isGithubActionSa ? 1 : 0));

            let deployed = false;
            let lastError = "";
            let lastClientEmail = "";
            let lastProjectId = "smart-sd-sts";

            for (const sa of validSas) {
              console.log(`\n========================================`);
              console.log(`Mencoba deploy menggunakan secret: ${sa.secretName}`);
              console.log(`Service Account: ${sa.clientEmail}`);
              console.log(`Target Project : ${sa.projectId}`);
              console.log(`========================================\n`);

              lastClientEmail = sa.clientEmail;
              lastProjectId = sa.projectId;

              fs.writeFileSync("/tmp/sa.json", sa.raw);
              fs.writeFileSync(".firebaserc", JSON.stringify({ projects: { default: sa.projectId } }, null, 2));

              const res = spawnSync(
                "npx",
                ["-y", "firebase-tools@13", "deploy", "--only", "hosting", "--project", sa.projectId, "--non-interactive"],
                {
                  env: { ...process.env, GOOGLE_APPLICATION_CREDENTIALS: "/tmp/sa.json" },
                   encoding: "utf8",
                }
              );

              console.log(res.stdout || "");
              if (res.stderr) console.error(res.stderr);

              if (res.status === 0) {
                console.log(`✅ Deploy berhasil ke https://${sa.projectId}.web.app`);
                deployed = true;
                break;
              } else {
                lastError = (res.stdout || "") + "\n" + (res.stderr || "");
                console.warn(`⚠️ Gagal deploy dengan ${sa.secretName}, mencoba kandidat berikutnya...`);
              }
            }

            try { fs.unlinkSync("/tmp/sa.json"); } catch (e) {}

            if (!deployed && (process.env.FIREBASE_TOKEN || "").trim()) {
              console.log("Mencoba deploy menggunakan FIREBASE_TOKEN...");
              const res = spawnSync(
                "npx",
                ["-y", "firebase-tools@13", "deploy", "--only", "hosting", "--project", "smart-sd-sts", "--token", process.env.FIREBASE_TOKEN.trim(), "--non-interactive"],
                { encoding: "utf8" }
              );
              console.log(res.stdout || "");
              if (res.stderr) console.error(res.stderr);
              if (res.status === 0) {
                deployed = true;
              } else {
                lastError = (res.stdout || "") + "\n" + (res.stderr || "");
              }
            }

            if (!deployed) {
              console.error("\n❌ DEPLOY KE FIREBASE HOSTING GAGAL.");
              if (lastClientEmail) {
                console.error("------------------------------------------------------------------------");
                console.error(`Penyebab umum (403 Permission Denied):`);
                console.error(`Service Account "${lastClientEmail}" belum memiliki role "Firebase Hosting Admin".`);
                console.error(`Cara mengaktifkan (hanya 1 menit, TIDAK perlu ganti Secret di GitHub):`);
                console.error(`1. Buka: https://console.cloud.google.com/iam-admin/iam?project=${lastProjectId}`);
                console.error(`2. Cari baris email: ${lastClientEmail}`);
                console.error(`3. Klik ikon Pensil (Edit principal) di sebelah kanan baris tersebut.`);
                console.error(`4. Klik "+ ADD ANOTHER ROLE" -> ketik dan pilih "Firebase Hosting Admin" & "Service Usage Consumer".`);
                console.error(`5. Klik Save, lalu klik "Re-run jobs" di GitHub Actions.`);
                console.error("------------------------------------------------------------------------");
              } else {
                console.error("Belum ada Secret FIREBASE_SERVICE_ACCOUNT yang valid di GitHub Secrets.");
              }
              process.exit(1);
            }
          '
