name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify Firebase Secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_SMART_SD_STS || secrets.FIREBASE_SERVICE_ACCOUNT_SMARTSTS_12F15 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT belum disetel di GitHub Secrets!"
            echo "======================================================================================"
            echo "PETUNJUK PENYELESAIAN:"
            echo "1. Buka Firebase Console: https://console.firebase.google.com/"
            echo "2. Pilih project: smart-sd-sts"
            echo "3. Masuk ke Project Settings (ikon roda gigi) -> Tab 'Service accounts'"
            echo "4. Klik tombol 'Generate new private key' (akan mendownload file .json)"
            echo "5. Buka repository ini di GitHub -> Settings -> Secrets and variables -> Actions"
            echo "6. Klik 'New repository secret'"
            echo "   - Name: FIREBASE_SERVICE_ACCOUNT"
            echo "   - Secret: Tempelkan (paste) seluruh isi file .json tersebut"
            echo "7. Klik 'Add secret', lalu jalankan ulang workflow ini (Re-run jobs)."
            echo "======================================================================================"
            exit 1
          fi
          echo "✅ Secret FIREBASE_SERVICE_ACCOUNT berhasil ditemukan."

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web App
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_SMART_SD_STS || secrets.FIREBASE_SERVICE_ACCOUNT_SMARTSTS_12F15 }}
          channelId: live
          projectId: smart-sd-sts


